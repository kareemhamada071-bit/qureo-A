
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUREO AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:white;
 font-family:Arial,sans-serif;padding:20px
}
main{
 max-width:480px;margin:35px auto;
 background:#151d32;padding:24px;border-radius:20px
}
h1{text-align:center;color:#55a5ff}
p{text-align:center;color:#bac6d9}
button,select,textarea{
 width:100%;padding:15px;margin-top:14px;
 border:0;border-radius:10px;font-size:16px
}
button{background:#2784ee;color:white;font-weight:bold}
select,textarea{background:#26334e;color:white}
textarea{min-height:130px}
.result{
 background:#26334e;padding:15px;
 margin-top:18px;border-radius:10px;line-height:1.8
}
</style>
</head>
<body>
<main>
<h1>Engineer Karim Hamada </h1>
<p>مساعدك الذكي للتدريبات التعليمية</p>

<button onclick="connect()">
الاتصال بمنصة Qureo
</button>

<label>اختر المادة</label>
<select id="subject">
<option>JavaScript</option>
<option>Python</option>
<option>الثقافة المالية</option>
</select>

<label>السؤال</label>
<textarea id="question"
placeholder="ضع السؤال هنا..."></textarea>

<button onclick="help()">
تحليل السؤال
</button>

<div class="result" id="result">
جاهز لاستقبال السؤال.
</div>
</main>

<script>
function connect(){
 window.open(
 "https://me-portal.qureo.education/login",
 "_blank"
 );
}

function help(){
 const q=document.getElementById("question").value;
 const s=document.getElementById("subject").value;
 const r=document.getElementById("result");

 if(!q.trim()){
  r.textContent="من فضلك اكتب السؤال أولاً.";
  return;
 }

 r.textContent=
 "تم استلام سؤالك في مادة "+s+
 ". محرك التحليل والذكاء الاصطناعي سيتم ربطه في المرحلة القادمة.";
}
</script>
</body>
</html>
