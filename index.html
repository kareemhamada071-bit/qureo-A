
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUREO AI 3D</title>

<style>
*{box-sizing:border-box}

:root{
  --blue:#168cff;
  --cyan:#00e5ff;
  --bg:#050914;
}

body{
  margin:0;
  min-height:100vh;
  padding:18px;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(ellipse at 50% 0%,#12346a 0%,transparent 48%),
    radial-gradient(ellipse at 100% 80%,#101c45 0%,transparent 40%),
    var(--bg);
  overflow-x:hidden;
}

main{
  max-width:680px;
  margin:25px auto;
  perspective:1000px;
}

header{
  text-align:center;
  padding:35px 15px;
  margin-bottom:25px;
  border:1px solid #287bdc;
  border-radius:25px;
  background:linear-gradient(145deg,#172b50,#091326);
  box-shadow:
    0 15px 35px #0009,
    0 0 25px #168cff35,
    inset 0 1px 1px #ffffff30;
  transform:rotateX(3deg);
}

.logo{
  font-size:39px;
  font-weight:900;
  letter-spacing:3px;
  color:#63caff;
  text-shadow:
    0 0 8px #168cff,
    0 0 20px #168cff,
    0 5px 0 #07509b;
}

header p{
  color:#b7d8ff;
  line-height:1.7;
}

.card{
  position:relative;
  padding:23px;
  margin-bottom:22px;
  border:1px solid #244a7c;
  border-radius:20px;
  background:linear-gradient(145deg,#15243d,#091426);
  box-shadow:
    0 12px 0 #07101e,
    0 18px 30px #0009,
    inset 0 1px 1px #ffffff25;
  transition:transform .25s,box-shadow .25s;
}

.card:hover{
  transform:translateY(-5px) rotateX(1deg);
  box-shadow:
    0 17px 0 #07101e,
    0 25px 35px #000b,
    0 0 20px #168cff30;
}

h2{
  color:#65c5ff;
  margin-top:0;
  text-shadow:0 0 12px #168cff55;
}

label{
  display:block;
  margin:15px 0 8px;
  color:#c5e4ff;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border:1px solid #315b8d;
  border-radius:12px;
  background:#071020;
  color:white;
  font-size:15px;
  outline:none;
  margin-bottom:10px;
  box-shadow:inset 0 3px 9px #0008;
}

input:focus,select:focus,textarea:focus{
  border-color:#00cfff;
  box-shadow:0 0 12px #168cff55;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  margin-top:9px;
  border:1px solid #62baff;
  border-radius:12px;
  color:white;
  font-size:16px;
  font-weight:bold;
  background:linear-gradient(145deg,#258fff,#0753b5);
  box-shadow:
    0 6px 0 #063775,
    0 10px 18px #0008,
    inset 0 1px 1px #ffffff60;
  cursor:pointer;
  transition:.15s;
}

button:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #063775;
}

.secondary{
  background:linear-gradient(145deg,#253b5d,#101d34);
  border-color:#45658d;
  box-shadow:0 6px 0 #091321;
}

.danger{
  background:linear-gradient(145deg,#d83e58,#861d37);
  border-color:#ff7890;
  box-shadow:0 5px 0 #511326;
}

.result{
  margin-top:16px;
  padding:17px;
  min-height:60px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.9;
  border:1px solid #2865a5;
  border-radius:13px;
  background:linear-gradient(145deg,#07182d,#050b16);
  box-shadow:inset 0 4px 12px #0009;
}

.item{
  margin-top:13px;
  padding:15px;
  border:1px solid #31547d;
  border-radius:13px;
  background:linear-gradient(145deg,#10223b,#081222);
  box-shadow:0 5px 12px #0007;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.item strong{color:#5bbaff}

footer{
  text-align:center;
  color:#8da9c9;
  padding:25px 5px;
  font-size:13px;
}

.glow{
  width:90px;
  height:3px;
  margin:12px auto;
  border-radius:50%;
  background:#00d9ff;
  box-shadow:0 0 15px #00d9ff,0 0 30px #168cff;
}

@media(max-width:450px){
  body{padding:12px}
  .logo{font-size:32px}
  .card{padding:17px}
  header{padding:27px 10px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
  }
}
</style>
</head>

<body>
<main>

<header>
  <div class="logo">QUREO AI</div>
  <div class="glow"></div>
  <p>مساعدك الذكي للتعلم والتدريب</p>
  <p>Engineer Karim Hamada Abu Malek</p>
</header>

<section class="card">
  <h2>🚀 مركز التدريب</h2>

  <label>اختر المادة</label>
  <select id="subject">
    <option value="JavaScript">JavaScript</option>
    <option value="Python">Python</option>
    <option value="الثقافة المالية">الثقافة المالية</option>
  </select>

  <label>اكتب السؤال</label>
  <textarea id="question" placeholder="اكتب السؤال هنا..."></textarea>

  <button onclick="searchQuestion()">🔍 ابحث عن الإجابة</button>

  <div id="result" class="result">
    الإجابة ستظهر هنا.
  </div>

  <button class="secondary" onclick="openQureo()">
    🌐 فتح منصة Qureo
  </button>
</section>

<section class="card">
  <h2>➕ إضافة سؤال جديد</h2>

  <label>المادة</label>
  <select id="saveSubject">
    <option value="JavaScript">JavaScript</option>
    <option value="Python">Python</option>
    <option value="الثقافة المالية">الثقافة المالية</option>
  </select>

  <label>السؤال</label>
  <textarea id="saveQuestion" placeholder="اكتب السؤال..."></textarea>

  <label>الإجابة أو الشرح</label>
  <textarea id="saveAnswer" placeholder="اكتب الإجابة أو الكود..."></textarea>

  <button onclick="saveQuestion()">💾 حفظ السؤال</button>
</section>

<section class="card">
  <h2>📚 مكتبة الأسئلة</h2>

  <input id="filter" placeholder="ابحث عن سؤال..." oninput="showSaved()">

  <div id="savedList"></div>
</section>

<footer>
  QUREO AI 3D
  <br><br>
  Designed by Engineer Karim Hamada Abu Malek
</footer>

</main>

<script>
const KEY="qureo_ai_3d_questions";

function getData(){
  try{
    return JSON.parse(localStorage.getItem(KEY)) || [];
  }catch(e){
    return [];
  }
}

function normalize(value){
  return value.trim().toLowerCase().replace(/\s+/g," ");
}

function saveQuestion(){
  const subject=document.getElementById("saveSubject").value;
  const question=document.getElementById("saveQuestion").value.trim();
  const answer=document.getElementById("saveAnswer").value.trim();

  if(!question || !answer){
    alert("اكتب السؤال والإجابة أولاً");
    return;
  }

  const data=getData();

  data.push({
    id:Date.now(),
    subject:subject,
    question:question,
    answer:answer
  });

  localStorage.setItem(KEY,JSON.stringify(data));

  document.getElementById("saveQuestion").value="";
  document.getElementById("saveAnswer").value="";

  showSaved();
  alert("تم حفظ السؤال بنجاح");
}

function searchQuestion(){
  const subject=document.getElementById("subject").value;
  const question=document.getElementById("question").value.trim();
  const result=document.getElementById("result");

  if(!question){
    result.textContent="اكتب السؤال أولاً.";
    return;
  }

  const found=getData().find(item=>
    item.subject===subject &&
    normalize(item.question)===normalize(question)
  );

  if(found){
    result.textContent="الإجابة المحفوظة:\n\n"+found.answer;
  }else{
    result.textContent=
      "لم نجد إجابة محفوظة لهذا السؤال.\n\n"+
      "يمكنك إضافته إلى مكتبة الأسئلة.";
  }
}

function showSaved(){
  const list=document.getElementById("savedList");
  const filter=normalize(document.getElementById("filter").value);

  list.innerHTML="";

  const filtered=getData().filter(item=>
    normalize(item.question).includes(filter) ||
    normalize(item.subject).includes(filter)
  );

  if(filtered.length===0){
    list.textContent="لا توجد أسئلة محفوظة.";
    return;
  }

  filtered.forEach(item=>{
    const box=document.createElement("div");
    box.className="item";

    const title=document.createElement("strong");
    title.textContent=item.subject;

    const question=document.createElement("p");
    question.textContent="السؤال: "+item.question;

    const answer=document.createElement("p");
    answer.textContent="الإجابة: "+item.answer;

    const remove=document.createElement("button");
    remove.className="danger";
    remove.textContent="حذف السؤال";
    remove.onclick=()=>deleteQuestion(item.id);

    box.append(title,question,answer,remove);
    list.appendChild(box);
  });
}

function deleteQuestion(id){
  if(!confirm("هل تريد حذف السؤال؟"))return;

  const data=getData().filter(item=>item.id!==id);
  localStorage.setItem(KEY,JSON.stringify(data));
  showSaved();
}

function openQureo(){
  window.open(
    "https://me-portal.qureo.education/login",
    "_blank"
  );
}

showSaved();
</script>

</body>
</html>
