<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030719">
<title>QUREO AI — Solve • Learn • Grow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cyan:#00eaff;--purple:#a855ff;--pink:#ed42ff;--ink:#030719;--panel:rgba(5,13,39,.84);--muted:#c6d5f4;--stroke:rgba(0,220,255,.36)}
body{min-height:100vh;background:var(--ink);color:#fff;font-family:Arial,'Noto Sans Arabic',sans-serif;overflow-x:hidden;position:relative;isolation:isolate}
.space{position:fixed;inset:0;z-index:-3;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#18245b 0%,#090e2c 45%,#020514 100%)}
.space:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 25% 35%,rgba(0,140,255,.35),transparent 22%),radial-gradient(circle at 75% 65%,rgba(157,30,255,.3),transparent 25%),radial-gradient(circle at 50% 10%,rgba(0,220,255,.15),transparent 25%);animation:nebula 18s ease-in-out infinite alternate}
@keyframes nebula{to{transform:rotate(12deg) scale(1.25)}}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 120px 90px,var(--cyan),transparent),radial-gradient(1px 1px at 200px 180px,#fff,transparent),radial-gradient(2px 2px at 300px 50px,#b58aff,transparent),radial-gradient(1px 1px at 400px 250px,#fff,transparent);background-size:450px 300px;animation:starsMove 35s linear infinite;opacity:.65}
@keyframes starsMove{to{transform:translateY(-300px)}}
.starfield{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.planet{position:absolute;border-radius:50%;filter:blur(1px);animation:float 9s ease-in-out infinite alternate}
.planet.one{width:230px;height:230px;top:13%;left:-75px;background:radial-gradient(circle at 30% 30%,#80eaff,#1853b7 40%,#080e38 75%);box-shadow:0 0 70px #126bff,inset -20px -15px 45px #02051b}
.planet.two{width:180px;height:180px;right:-65px;bottom:12%;background:radial-gradient(circle at 35% 30%,#e3aaff,#7132b6 45%,#13072f 80%);box-shadow:0 0 70px #922fff,inset -20px -20px 45px #08021c;animation-delay:-4s}
@keyframes float{from{transform:translateY(-15px) rotate(-5deg)}to{transform:translateY(20px) rotate(8deg)}}
.glow{position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,transparent 30%,rgba(2,5,22,.67))}
.developer{position:absolute;top:12px;right:14px;z-index:2;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 7px;border:1px solid rgba(0,234,255,.48);border-radius:42px;background:rgba(5,15,45,.76);box-shadow:0 0 22px rgba(0,180,255,.18);backdrop-filter:blur(12px);font-size:10px;color:#dcecff;direction:ltr}
.avatar-button{position:relative;flex:0 0 38px;width:38px;height:38px;padding:0;border:1px solid #00eaffaa;border-radius:50%;background:linear-gradient(145deg,#144d8a,#7b35b8);color:white;display:grid;place-items:center;font:bold 12px Arial;overflow:hidden;box-shadow:0 0 12px #00cfff55}
.avatar-button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar-button .cam{position:absolute;right:0;bottom:0;width:15px;height:15px;border-radius:50%;background:#00dff5;color:#061529;font-size:9px;display:grid;place-items:center;border:1px solid #071126}
.developer-copy{display:grid;gap:3px}
.developer-copy small{font-size:9px;color:#a8c5dc;letter-spacing:.2px}
.developer-copy strong{font-size:11px;color:var(--cyan);text-shadow:0 0 10px #00eaff55;font-weight:700}
.developer input{display:none}
header{text-align:center;padding:72px 15px 18px}
.logo{font-size:clamp(42px,8vw,76px);font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#00eaff,#9a5cff,#ff3de5,#00eaff);background-size:300%;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #147cff);animation:logo 6s linear infinite}
@keyframes logo{to{background-position:300% center}}
.subtitle{margin-top:9px;color:#cbdcff;font-size:15px;text-shadow:0 0 12px #168bff;letter-spacing:1px}
.container{width:min(1120px,94%);margin:25px auto 36px;display:grid;grid-template-columns:1.08fr .92fr;gap:22px;align-items:stretch;direction:ltr}
.panel{direction:rtl;padding:23px;border-radius:22px;border:1px solid var(--stroke);background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 0 25px rgba(0,160,255,.16),inset 0 0 30px rgba(70,90,200,.08);transition:.3s;min-width:0}
.panel:hover{border-color:var(--purple);box-shadow:0 0 30px rgba(150,50,255,.2)}
.panel h2{color:var(--cyan);margin-bottom:16px;text-shadow:0 0 12px #008cff;font-size:21px}
.robot{text-align:center;font-size:76px;margin:4px 0 12px;filter:drop-shadow(0 0 20px #00cfff);animation:robot 4s ease-in-out infinite}
@keyframes robot{50%{transform:translateY(-10px)}}
.intro-title{text-align:center;color:#fff;font-size:20px;margin-bottom:16px}
.features{display:grid;gap:12px}
.feature{padding:14px 15px;border-radius:14px;background:rgba(30,65,130,.25);border:1px solid rgba(100,170,255,.25);transition:.25s}
.feature:hover{transform:translateX(-4px);border-color:var(--cyan)}
.feature strong{display:block;color:#8edfff;margin-bottom:5px;font-size:14px}
.feature p{color:#c6d5f4;line-height:1.7;font-size:13px}
.form-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form-heading h2{margin-bottom:12px}
.status{font-size:10px;color:#b8d9e8;display:flex;align-items:center;gap:6px}
.status i{width:6px;height:6px;border-radius:50%;background:#68ffa7;box-shadow:0 0 9px #68ffa7}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label,.question-label{display:block;margin:12px 0 7px;color:#bcecff;font-size:13px;font-weight:700}
.select-wrap{position:relative}
.select-wrap:after{content:'⌄';position:absolute;left:12px;top:10px;color:#9cd8ef;pointer-events:none}
.field select{appearance:none;width:100%;padding:11px 12px;color:#fff;background:#101d40;border:1px solid #246cbb;border-radius:11px;outline:none;font-size:13px}
.field select option{background:#101d40}
.field select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(0,234,255,.22)}
.question-row{display:flex;align-items:center;justify-content:space-between}
.question-row .question-label{margin-bottom:7px}
.counter{font:10px ui-monospace,monospace;color:#8ba8cc;direction:ltr}
textarea{display:block;width:100%;min-height:118px;resize:vertical;padding:13px;color:#fff;background:#0a1532;border:1px solid #246cbb;border-radius:12px;outline:none;font-size:13px;line-height:1.8}
textarea::placeholder{color:#8798bd}
.image-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.image-add{display:inline-flex;align-items:center;gap:7px;border:1px dashed #4b77bd;background:#142351;color:#dceaff;border-radius:10px;padding:8px 11px;font-size:11px;cursor:pointer;transition:.2s}
.image-add:hover{border-color:var(--cyan);box-shadow:0 0 12px #00eaff25}
.image-hint{color:#8fa5cd;font-size:10px}
.image-preview{display:none;align-items:center;gap:10px;margin-top:10px;padding:8px;border:1px solid #255b8c;border-radius:11px;background:#0c1938}
.image-preview.show{display:flex}
.image-preview img{width:62px;height:52px;object-fit:cover;border-radius:7px;border:1px solid #00eaff66}
.image-info{min-width:0;flex:1;color:#d7eaff;font-size:10px}
.image-info span{display:block;color:#94acd1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.image-remove{border:1px solid #743c77;background:#351d52;color:#ffe3f9;border-radius:8px;padding:6px 8px;font-size:10px}
.quick{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
.quick-label{font-size:11px;color:#9eb7df}
.quick button{border:1px solid #42518a;background:rgba(30,44,91,.62);color:#dce5ff;border-radius:999px;padding:6px 10px;font-size:10px;transition:.2s}
.quick button:hover{border-color:var(--cyan);color:#fff;transform:translateY(-1px)}
.modebar{display:flex;align-items:center;gap:9px;margin-top:15px}
.mode-label{font-size:11px;color:#a9c2e2;white-space:nowrap}
.modes{display:flex;gap:5px;flex:1;padding:4px;background:#0b1532;border:1px solid #293e71;border-radius:10px}
.mode{flex:1;border:0;border-radius:7px;background:transparent;color:#acbbdc;padding:7px 4px;font-size:11px}
.mode.active{background:linear-gradient(100deg,#00eaff25,#a855ff30);color:#fff;box-shadow:inset 0 0 0 1px #00eaff66}
.buttons{display:flex;gap:10px;margin-top:15px}
.buttons button{flex:1;padding:12px 14px;border:0;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;transition:.25s}
.solve{color:#041126;background:linear-gradient(90deg,#00eaff,#8b5cff);box-shadow:0 0 15px rgba(0,200,255,.2)}
.clear{color:#fff;background:#26375e;border:1px solid #5275ad!important}
.buttons button:hover{transform:translateY(-2px);filter:brightness(1.13)}
.buttons button:disabled{opacity:.6;cursor:wait}
.loading{display:none;color:#a8f6ff;font-size:12px;margin-top:11px}
.loading.show{display:block}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ffffff44;border-top-color:var(--cyan);border-radius:50%;vertical-align:-2px;margin-left:6px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.answer{margin-top:16px;padding:15px;border-radius:14px;background:rgba(0,10,30,.78);border:1px solid rgba(0,234,255,.3);min-height:78px;line-height:1.8;color:#d7eaff;white-space:pre-wrap;font-size:13px}
.answer pre{direction:ltr;text-align:left;white-space:pre-wrap;background:#071026;border:1px solid #28507a;border-radius:10px;padding:12px;color:#aaf1ff;overflow:auto;font:12px/1.7 ui-monospace,monospace}
.answer-actions{display:flex;gap:8px;margin-top:9px}
.mini{border:1px solid #47618b;background:#162653;color:#dceaff;padding:6px 10px;border-radius:8px;font-size:10px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(1120px,94%);margin:0 auto;padding:14px 0 24px;color:#b9c9e9;font-size:11px;border-top:1px solid #84caff20}
.foot .credit-bottom{direction:ltr;color:#9ec7e3;font-size:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,15px);opacity:0;transition:.25s;z-index:5;pointer-events:none;background:#182951;border:1px solid #00eaff66;border-radius:10px;padding:9px 14px;font-size:12px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:1600px){.container,.foot{width:min(1280px,90%)}.container{gap:30px;margin-top:35px}.panel{padding:30px}.feature{padding:18px}.robot{font-size:92px}}
@media(min-width:901px) and (max-width:1200px){.container{width:96%;grid-template-columns:1.04fr .96fr;gap:16px}.panel{padding:19px}.fields{gap:9px}.field select{padding:10px 9px;font-size:12px}}
@media(min-width:761px) and (max-width:900px){.container{grid-template-columns:1fr;width:min(680px,92%);gap:16px}.form{order:1}.intro{order:2}.panel{padding:21px}}
@media(max-width:760px){header{padding-top:78px}.container{grid-template-columns:1fr;width:min(620px,94%);margin-top:18px}.panel{padding:19px}.intro{order:2}.form{order:1}.robot{font-size:65px}.planet.one{width:145px;height:145px;left:-70px}.planet.two{width:120px;height:120px;right:-55px}.developer{right:10px;font-size:9px;padding:6px 9px}.avatar-button{width:36px;height:36px;flex-basis:36px}.developer-copy small{font-size:8px}.developer-copy strong{font-size:10px}.foot{width:min(620px,94%);flex-direction:column;text-align:center}}
@media(max-width:430px){.logo{font-size:42px}.subtitle{font-size:13px}.container{width:calc(100% - 22px);gap:14px}.panel{padding:16px}.fields{gap:8px}.field select{padding:10px 8px;font-size:12px}.quick button{font-size:9px;padding:6px 8px}.modebar{display:block}.mode-label{display:block;margin-bottom:7px}.buttons button{font-size:12px;padding:12px 8px}.form-heading h2{font-size:19px}}
/* لمسات تنسيق نهائية: توازن المسافات، وضوح التفاعل، وعمق بصري هادئ */
header{padding-bottom:24px}
.logo{line-height:1.08;filter:drop-shadow(0 0 12px #147cff)}
.container{margin-top:20px;margin-bottom:32px;gap:20px;align-items:stretch}
.panel{position:relative;overflow:hidden;padding:25px 26px;border-color:rgba(72,193,255,.34);background:linear-gradient(145deg,rgba(8,18,52,.91),rgba(5,12,34,.86));box-shadow:0 18px 55px rgba(0,0,0,.24),0 0 24px rgba(0,160,255,.10),inset 0 1px rgba(255,255,255,.035)}
.panel:before{content:"";position:absolute;top:0;right:24px;width:72px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple));filter:drop-shadow(0 0 5px var(--cyan));opacity:.8}
.panel:hover{transform:translateY(-2px);border-color:rgba(0,234,255,.62);box-shadow:0 22px 60px rgba(0,0,0,.29),0 0 28px rgba(116,63,255,.17)}
.panel h2{letter-spacing:.1px;line-height:1.5}
.form-heading{padding-bottom:5px;border-bottom:1px solid rgba(140,196,255,.11);margin-bottom:12px}
.status{padding:6px 9px;border:1px solid rgba(104,255,167,.22);border-radius:999px;background:rgba(104,255,167,.055)}
.field label,.question-label{letter-spacing:.1px}
.field select,textarea{transition:border-color .2s,box-shadow .2s,background .2s}
.field select:hover,textarea:hover{border-color:#468aca}
textarea{min-height:132px;padding:15px 16px;background:linear-gradient(145deg,#0a1532,#0b1838);}
.quick{padding-top:2px}
.quick-label{margin-left:2px}
.quick button{padding:7px 11px;background:rgba(18,34,76,.78)}
.modebar{padding-top:5px}
.modes{box-shadow:inset 0 1px 6px rgba(0,0,0,.22)}
.mode{transition:background .2s,color .2s,box-shadow .2s}
.buttons{margin-top:17px}
.buttons button{min-height:45px;letter-spacing:.1px}
.solve{background:linear-gradient(105deg,#00eaff,#58b9ff 52%,#a855ff);box-shadow:0 7px 22px rgba(0,191,255,.18),inset 0 1px rgba(255,255,255,.35)}
.clear{background:rgba(33,49,91,.82)}
.answer{background:linear-gradient(145deg,rgba(3,10,31,.88),rgba(8,17,45,.88));border-color:rgba(0,234,255,.24);box-shadow:inset 0 1px 8px rgba(0,0,0,.16)}
.feature{background:linear-gradient(115deg,rgba(34,67,132,.28),rgba(25,41,93,.28));border-color:rgba(111,167,255,.22)}
.feature strong{font-size:14px}
.feature p{line-height:1.85}
.robot{filter:drop-shadow(0 0 18px #00cfff);}
button:focus-visible,.image-add:focus-visible,.avatar-button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
@media(max-width:760px){.container{gap:16px}.panel{padding:21px}.intro{order:2}.form{order:1}}
@media(max-width:430px){header{padding-bottom:15px}.panel{padding:17px}.form-heading{align-items:flex-start}.status{font-size:9px}.answer{padding:13px}}
/* الشريط التعريفي الصغير بين عنوان QUREO AI ونموذج السؤال */
.intro-strip{width:min(1000px,94%);margin:0 auto 18px;display:grid;grid-template-columns:54px 1fr;align-items:center;gap:13px;padding:12px 16px}
.intro-strip .robot{font-size:38px;margin:0;line-height:1}
.intro-strip .intro-title{font-size:15px;text-align:right;margin:0 0 8px;text-shadow:0 0 10px #168bff}
.intro-strip .features{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.intro-strip .feature{padding:8px 10px;border-radius:11px}
.intro-strip .feature strong{font-size:10px;margin-bottom:3px}
.intro-strip .feature p{font-size:9px;line-height:1.5}
.container{width:min(900px,94%);grid-template-columns:minmax(0,1fr);margin:0 auto 30px;direction:rtl}
@media(min-width:1600px){.intro-strip{width:min(1100px,88%)}.container{width:min(900px,82%)}}
@media(min-width:761px) and (max-width:900px){.intro-strip{width:min(680px,92%);grid-template-columns:42px 1fr;padding:11px}.intro-strip .features{grid-template-columns:repeat(2,minmax(0,1fr))}.intro-strip .robot{font-size:32px}}
@media(max-width:760px){.intro-strip{width:min(620px,94%);grid-template-columns:36px 1fr;gap:9px;padding:11px 12px;margin-bottom:14px}.intro-strip .robot{font-size:29px}.intro-strip .intro-title{font-size:13px;margin-bottom:7px}.intro-strip .features{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.intro-strip .feature{padding:7px 8px}.intro-strip .feature strong{font-size:9px}.intro-strip .feature p{font-size:8px}}
@media(max-width:430px){.intro-strip{width:calc(100% - 22px);grid-template-columns:30px 1fr;gap:7px;padding:9px}.intro-strip .robot{font-size:25px}.intro-strip .feature{padding:6px}.intro-strip .feature strong{font-size:8px}.intro-strip .feature p{font-size:7px}}
/* شريط تعريف المطور وحجم الصورة */
.developer{top:12px;right:14px;gap:9px;padding:6px 12px 6px 7px;font-size:10px}
.avatar-button{width:38px;height:38px;flex-basis:38px}
.developer-copy small{font-size:9px}
.developer-copy strong{font-size:11px}
/* ضبط استجابة أحجام الشاشات */
.container{direction:rtl}
@media(min-width:901px) and (max-width:1200px){.container{width:96%;gap:16px}.panel{padding:19px}.fields{gap:9px}}
@media(min-width:761px) and (max-width:900px){.container{width:min(680px,92%);gap:16px}}
@media(max-width:760px){.developer{right:10px;gap:8px;padding:6px 9px}.avatar-button{width:36px;height:36px;flex-basis:36px}.developer-copy small{font-size:8px}.developer-copy strong{font-size:10px}}
@media(max-width:430px){.developer{top:10px;right:8px}.intro-strip{width:calc(100% - 22px)}}
button:focus-visible,.image-add:focus-visible,.avatar-button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="space"><canvas class="starfield" id="starfield" aria-hidden="true"></canvas><div class="stars"></div><div class="planet one"></div><div class="planet two"></div></div><div class="glow"></div>
<div class="developer"><label class="avatar-button" for="profileInput" title="اختيار الصورة الشخصية"><span>KH</span><img id="profilePreview" alt="صورة كريم" hidden><span class="cam">+</span></label><input id="profileInput" type="file" accept="image/*" aria-label="اختيار صورة شخصية"><span class="developer-copy"><small>Designed &amp; Developed by</small><strong>Kareem Hamada</strong></span></div>
<header><div class="logo">QUREO AI</div><p class="subtitle">Solve • Learn • Grow</p></header>
<section class="panel intro-strip">
  <div class="robot">🤖</div>
  <div class="intro-content"><h2 class="intro-title">مرحباً بك في QUREO AI</h2>
    <div class="features">
      <div class="feature"><strong>✨ مساعدة ذكية</strong><p>افهم السؤال والتدريب.</p></div>
      <div class="feature"><strong>📚 شرح مبسط</strong><p>خطوات سهلة وواضحة.</p></div>
      <div class="feature"><strong>💻 مواد متعددة</strong><p>Python وJavaScript والثقافة المالية.</p></div>
      <div class="feature"><strong>🎯 تعلّم بطريقتك</strong><p>تلميح أو شرح أو إجابة.</p></div>
    </div>
  </div>
</section>
<main class="container">
<section class="panel form">
  <div class="form-heading"><h2>🚀 حلّل سؤالك</h2><span class="status"><i></i> جاهز للمساعدة</span></div>
  <div class="fields">
    <div class="field"><label for="subject">اختر المادة</label><div class="select-wrap"><select id="subject"><option value="JavaScript">JavaScript</option><option value="Python">Python</option><option value="الثقافة المالية">الثقافة المالية</option></select></div></div>
    <div class="field"><label for="type">نوع السؤال</label><div class="select-wrap"><select id="type"><option value="اختيار من متعدد">اختيار من متعدد</option><option value="برمجة">برمجة</option><option value="سؤال آخر">سؤال آخر</option></select></div></div>
  </div>
  <div class="field" id="levelField" hidden><label for="level">مستوى كوريو (اختياري)</label><div class="select-wrap"><select id="level"><option value="">اختر المستوى</option></select></div></div>
  <div class="question-row"><label class="question-label" for="question">اكتب السؤال هنا</label><span class="counter" id="counter">0 / 2000</span></div>
  <textarea id="question" maxlength="2000" placeholder="انسخ السؤال والصقه هنا..."></textarea>
  <div class="image-tools"><label class="image-add" for="questionImage">＋ أضف صورة للسؤال</label><input id="questionImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><span class="image-hint">PN
