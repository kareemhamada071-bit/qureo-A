```html

<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Tahoma, Arial, sans-serif;
    color: white;
    min-height: 100vh;
    background: linear-gradient(135deg, #05051c, #101044, #180d38);
    overflow-x: hidden;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background-image:
      radial-gradient(2px 2px at 20px 30px, white, transparent),
      radial-gradient(2px 2px at 100px 150px, #9c8cff, transparent),
      radial-gradient(2px 2px at 200px 80px, white, transparent),
      radial-gradient(2px 2px at 300px 200px, #8b9dff, transparent),
      radial-gradient(2px 2px at 400px 50px, white, transparent);
    background-size: 450px 300px;
    animation: starsMove 20s linear infinite;
}

@keyframes starsMove {
    from { transform: translateY(0); }
    to { transform: translateY(300px); }
}

.container {
    width: 92%;
    max-width: 850px;
    margin: 35px auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header p {
    color: #c9c4ff;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 12px;
}

.header h1 {
    font-size: 42px;
    color: #a99cff;
    text-shadow: 0 0 20px #705cff;
}

.header .subtitle {
    color: #d4d0ff;
    margin-top: 10px;
    font-size: 15px;
}

.card {
    background: rgba(17, 17, 55, 0.88);
    border: 1px solid rgba(157, 140, 255, 0.35);
    border-radius: 20px;
    padding: 23px;
    margin-bottom: 20px;
    box-shadow: 0 0 25px rgba(99, 75, 255, 0.13);
}

    text-align: center;
}

.profile img {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #9887ff;
    box-shadow: 0 0 20px #6655ff;
    margin-bottom: 12px;
}

.profile h3 {
    color: #c5bbff;

}

h2 {
    font-size: 20px;

label {

    margin: 15px 0 8px;

    font-weight: bold;
}

select, textarea {
    width: 100%;

    border: 1px solid #514a91;
    outline: none;

}

    border: 2px dashed #7165bd;

    border-radius: 14px;
    margin-top: 12px;

}

#imagePreview {
    display: none;

}

.answer {
    display: none;
    white-space: pre-wrap;

.loading {
    color: #c5baff;

    margin-top: 18px;
}

.footer {
    text-align: center;
    color: #9992c9;
    font-size: 13px;
    padding: 20px 0;
}

@media(max-width: 600px) {
    .container {
        width: 94%;
        margin: 20px auto;
    }

    .header h1 {
        font-size: 34px;
    }

    .card {
        padding: 16px;
    }

    button {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

    <header class="header">
        <p>صُمم بواسطة البشمهندس كريم حمادة</p>
        <h1>QUREO AI</h1>
        <div class="subtitle">مساعدك الذكي لحل وفهم الأسئلة البرمجية</div>
    </header>

    <section class="card profile">
        <img src="kareem.jpg" alt="صورة المصمم"
             onerror="this.style.display='none'">
        <h3>مرحبًا بك في QUREO AI</h3>
    </section>

    <section class="card">
        <h2>🤖 حل سؤالك بالذكاء الاصطناعي</h2>

        <label for="subject">اختر لغة البرمجة</label>
        <select id="subject">
            <option value="Python">Python</option>
            <option value="JavaScript">JavaScript</option>
            <option value="أخرى">أخرى</option>
        </select>

        <label for="questionType">نوع السؤال</label>
        <select id="questionType">
            <option value="حل السؤال وشرح الإجابة">حل وشرح</option>
            <option value="اكتشاف الأخطاء وتصحيح الكود">تصحيح كود</option>
            <option value="شرح الكود بالتفصيل">شرح كود</option>
            <option value="كتابة كود يحقق المطلوب">كتابة كود</option>
        </select>

        <label for="question">اكتب السؤال أو الكود هنا</label>
        <textarea id="question"
          maxlength="5000"
          placeholder="اكتب سؤالك البرمجي هنا..."></textarea>

        <div class="counter">
            <span id="count">0</span> / 5000
        </div>

        <div class="upload-box">
            <p>📷 يمكنك اختيار صورة للسؤال لمعاينتها</p>
            <input type="file" id="imageInput" accept="image/*">
            <img id="imagePreview" alt="معاينة الصورة">
        </div>

        <label>طريقة الشرح</label>
        <div class="mode-buttons">
            <button class="active" onclick="setMode('simple', this)">
                شرح مبسط
            </button>
            <button onclick="setMode('detailed', this)">
                شرح مفصل
            </button>
        </div>

        <div class="buttons">
            <button class="solve-btn" id="solveButton"
                    onclick="solveQuestion()">
                ✨ حل السؤال
            </button>
            <button class="clear-btn" onclick="clearAll()">
                مسح
            </button>
        </div>

        <div class="loading" id="loading">
            جاري التفكير وحل السؤال... انتظر قليلًا
        </div>

        <div class="answer" id="answer"></div>
    </section>

    <section class="card">
        <h2>⚡ أمثلة سريعة</h2>
        <button class="example-btn"
          onclick="setExample('اكتب برنامجًا يجمع العددين 2 و 2 ويطبع الناتج')">
          مثال جمع
        </button>
        <button class="example-btn"
          onclick="setExample('اكتب برنامجًا يطبع Hello World')">
          Hello World
        </button>
        <button class="example-btn"
          onclick="setExample('اشرح لي ما هي المتغيرات في البرمجة')">
          شرح المتغيرات
        </button>
    </section>

    <footer class="footer">
        QUREO AI © 2026 - جميع الحقوق محفوظة
    </footer>

</div>

<script>
let selectedMode = "simple";

const question = document.getElementById("question");
const answer = document.getElementById("answer");
const loading = document.getElementById("loading");
const solveButton = document.getElementById("solveButton");

question.addEventListener("input", function() {
    document.getElementById("count").textContent =
        this.value.length;
});

function setMode(mode, button) {
    selectedMode = mode;

    document.querySelectorAll(".mode-buttons button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
}

function setExample(text) {
    question.value = text;
    document.getElementById("count").textContent =
        text.length;
    question.focus();
}

function clearAll() {
    question.value = "";
    answer.textContent = "";
    answer.style.display = "none";
    document.getElementById("count").textContent = "0";
    document.getElementById("imageInput").value = "";
    document.getElementById("imagePreview").src = "";
    document.getElementById("imagePreview").style.display = "none";
}

document.getElementById("imageInput")
.addEventListener("change", function() {
    const file = this.files[0];
    const preview = document.getElementById("imagePreview");

    if (!file) {
        preview.style.display = "none";
        return;
    }

    if (!file.type.startsWith("image/")) {
        alert("من فضلك اختر صورة صحيحة.");
        this.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
});

function getResponseText(response) {
    if (typeof response === "string") return response;

    if (response?.message?.content) {
        const content = response.message.content;

        if (typeof content === "string") return content;

        if (Array.isArray(content)) {
            return content.map(item => item.text || "")
                .join("\n");
        }
    }

    if (response?.text) return response.text;

    return JSON.stringify(response, null, 2);
}

async function solveQuestion() {
    const text = question.value.trim();
    const subject = document.getElementById("subject").value;
    const type = document.getElementById("questionType").value;

    if (!text) {
        alert("من فضلك اكتب السؤال أولًا.");
        question.focus();
        return;
    }

    if (!window.puter || !puter.ai) {
        alert("خدمة الذكاء الاصطناعي لم يتم تحميلها. تأكد من اتصال الإنترنت ثم حدّث الصفحة.");
        return;
    }

    const languageInstruction = subject === "أخرى"
        ? "حدد لغة البرمجة المناسبة من السؤال نفسه، واذكر اللغة التي اخترتها."
        : `مهم جدًا: لغة البرمجة المطلوبة هي ${subject}. 
يجب أن يكون الكود والإجابة البرمجية بهذه اللغة فقط.
لا تحول السؤال إلى لغة برمجة أخرى.
إذا كان السؤال مكتوبًا بلغة مختلفة، اشرح التصحيح باستخدام ${subject}.`;

    const explanation = selectedMode === "simple"
        ? "استخدم شرحًا عربيًا بسيطًا مناسبًا للمبتدئين."
        : "استخدم شرحًا عربيًا مفصلًا خطوة بخطوة.";

    const prompt = `
أنت مساعد تعليمي متخصص في البرمجة.

${languageInstruction}

نوع المطلوب: ${type}

قواعد الإجابة:
1. افهم السؤال جيدًا قبل الحل.
2. اكتب الحل الصحيح بلغة البرمجة المحددة.
3. لا تخلط بين لغات البرمجة.
4. اشرح الحل باللغة العربية.
5. اذكر الناتج المتوقع إن وجد.
6. إذا كان السؤال ناقصًا أو غير واضح، وضح ذلك بدل اختراع معلومات.
7. لا تدّعِ أنك قرأت صورة؛ اعتمد على نص السؤال المكتوب فقط.

${explanation}

السؤال:
${text}
`;

    answer.style.display = "none";
    loading.style.display = "block";
    solveButton.disabled = true;
    solveButton.textContent = "جاري الحل...";

    try {
        const response = await puter.ai.chat(prompt);
        const result = getResponseText(response);

        if (!result || result === "undefined") {
            throw new Error("وصل رد فارغ من خدمة الذكاء الاصطناعي.");
        }

        answer.textContent = result;
        answer.style.display = "block";

    } catch (error) {
        answer.textContent =
            "تعذر الحصول على الإجابة.\n\n" +
            "التفاصيل: " + (error.message || error) +
            "\n\nتأكد من تسجيل الدخول إلى Puter في نفس المتصفح، ثم حاول مرة أخرى.";

        answer.style.display = "block";

    } finally {
        loading.style.display = "none";
        solveButton.disabled = false;
        solveButton.textContent = "✨ حل السؤال";
    }
}
</script>

</body>
</html>
